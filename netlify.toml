# Publicar a pasta do site clonado (encomenda)
[build]
  publish = "rastreamentotributario.online/encomenda"
  functions = "netlify/functions"

# Redirecionar SPA: se alguém acessar /app sem index.html, ainda funciona
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/"
  to = "/app/index.html"
  status = 200
