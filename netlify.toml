[build]
  # Diretório que contém o conteúdo do site para publicação
  publish = "rastreamentotributario.online"
  
  # Diretório onde estão as Netlify Functions
  functions = "netlify/functions"

[[redirects]]
  # Redireciona a raiz para o app principal
  from = "/"
  to = "/encomenda/app/index.html"
  status = 200

[[redirects]]
  # Redireciona todas as outras rotas para o index.html (SPA behavior)
  from = "/*"
  to = "/encomenda/app/index.html"
  status = 200
  force = false
