[build]
  # Diretório que contém o conteúdo do site para publicação
  # Raiz (/) = formulário CPF | /app/ = página de resultado
  publish = "rastreamentotributario.online/encomenda"
  
  # Diretório onde estão as Netlify Functions
  functions = "netlify/functions"

# /app e /app/ redirecionam para /app/index.html
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/"
  to = "/app/index.html"
  status = 200
